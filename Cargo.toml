[package]
name = "sonarr-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-sonarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's library.curate contract in front of Sonarr"
publish = false

[[bin]]
name = "sonarr-adapter"
path = "src/main.rs"

[dependencies]
adapter-kit-servarr = { git = "https://github.com/lemonfiber/adapter-kit-servarr", rev = "c95a7d059841c0e5d47b83a91912a7cdf4f4c2b3" }
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "bf525eadbff0d58952f8e3b5013ef360a9d000ee" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
